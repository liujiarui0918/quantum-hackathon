[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-hackathon"
version = "0.1.0"
description = "QUBO, constraint, annealing, QAOA, hybrid, and learning-guided optimization MVP for the quantum hackathon track."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
quantum-metax-demo = "quantum_hackathon.metax_demo:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
