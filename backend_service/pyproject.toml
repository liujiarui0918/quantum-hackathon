[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-service"
version = "0.1.0"
description = "REST API backend for the quantum hackathon optimization demo."
readme = ""
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "quantum-hackathon @ file:../",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
